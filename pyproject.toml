[project]
name = "d2bg"
version = "2.0.0"
description = "Dota 2 companion: draft advice, builds, live timers and post-game review from Game State Integration and public data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "typer>=0.12",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
# Always-on-top compact window (a separate OS window, see docs/SAFETY.md).
window = ["pywebview>=5.3"]
# Retraining the draft model. Inference needs none of this.
train = ["numpy>=2.1", "scikit-learn>=1.5"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "numpy>=2.1",
  "scikit-learn>=1.5",
]

[project.scripts]
d2bg = "d2bg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2bg"]

[tool.hatch.build.targets.wheel.force-include]
"data/snapshot" = "d2bg/_snapshot"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# The v1 desktop app (main.py, logic/, ml/, ui/, scripts/) predates the linters and is kept as is.
extend-exclude = ["main.py", "logic", "ml", "ui", "scripts", "data", "web", "tests/test_*.py", "tests/_dataset.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W", "PL", "RUF", "SIM", "C4", "PT"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101", "S311", "E501", "PLR0912", "PLR0915", "PLC0415", "PLR0911", "B008"]

[tool.ruff.lint.per-file-ignores]
# Compound asserts read better in these tests; a broad raises is fine where the message is checked.
"tests/**" = ["PT018", "PT011", "S105", "S106"]
# Explorer SQL interpolates only integers computed in this file; OpenDota's explorer is read only.
"src/d2bg/pipeline/refresh.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["d2bg"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/d2bg"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/d2bg"]
addopts = "-q"
markers = ["slow: trains models or builds the full snapshot"]

[tool.coverage.run]
source = ["d2bg"]
omit = ["src/d2bg/window.py"]
